# Git hooks (proj-mgmt/12 section 2). Installed by the root `prepare` script (`lefthook install`).
# Skip once with `LEFTHOOK=0 git commit ...`.

pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{ts,tsx,js,mjs,cjs}'
      exclude:
        - 'apps/legacy/**'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: '*.{ts,tsx,js,mjs,cjs,json,css,md,yml,yaml}'
      exclude:
        - 'apps/legacy/**'
        - 'pnpm-lock.yaml'
        - 'CHANGELOG.md'
        # Planning docs follow their own ~100-column prose style (proj-mgmt/README.md).
        - 'proj-mgmt/**'
      run: pnpm exec prettier --check {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    verify:
      run: pnpm turbo run typecheck test
